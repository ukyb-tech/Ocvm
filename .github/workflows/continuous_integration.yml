name: Continuous Integration

on:
  workflow_call:
  repository_dispatch:
    types: [compile-private-pr]

jobs:
  # New: Separate job to set pending status immediately
  notify-pending:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set PR Status to Pending
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ukyb-tech/Beylik_v1/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state": "pending", "description": "Public CI is building...", "context": "Public-GDExtension-Compiler"}'

  build:
    needs: notify-pending  # Wait for pending status to be set
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }
            target-type: template_debug
            float-precision: double
          - target: { platform: macos, arch: universal, os: macos-latest }
            target-type: template_debug
            float-precision: single

    runs-on: ${{ matrix.target.os }}
    steps:
      # Remove the "Set PR Status to Pending" step from here
      
      # 1. Checkout Ocvm (to grab godot-cpp cache systems & template configs)
      - name: Checkout Ocvm Template
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Fix: use 'recursive' instead of 'true'

      # 2. Checkout the private source code into a subfolder named 'src'
      - name: Checkout Private Source Code
        if: github.event_name == 'repository_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ukyb-tech/Beylik_v1
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.ref }}
          path: src

      # 3. Multilib support
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # 4. Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # 5. Scons Cache Management
      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # 6. Compile GDExtension
      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      # 7. Save Scons Cache
      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # 8. Upload Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-binaries-${{ matrix.target.platform }}
          path: bin/

  # New: Final status job that reports after all builds complete
  report-status:
    if: github.event_name == 'repository_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set PR Status to Success
        if: ${{ success() }}
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ukyb-tech/Beylik_v1/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state": "success", "description": "Compilation passed! Check Ocvm Actions tab for logs.", "context": "Public-GDExtension-Compiler", "target_url": "https://github.com/ukyb-tech/Ocvm/actions/runs/${{ github.run_id }}"}'

      - name: Set PR Status to Failure
        if: ${{ failure() }}
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CROSS_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ukyb-tech/Beylik_v1/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state": "failure", "description": "Compilation failed. Click details for logs.", "context": "Public-GDExtension-Compiler", "target_url": "https://github.com/ukyb-tech/Ocvm/actions/runs/${{ github.run_id }}"}'
