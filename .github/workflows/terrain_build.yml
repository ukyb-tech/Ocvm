name: Terrain Build Pipeline

on:
  workflow_dispatch:
  

jobs:
  terrain-preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python + libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gdal-bin
          pip install numpy rasterio pillow shapely trimesh pyyaml requests

      # 1. Download Copernicus DEM tiles (tile-based)
      - name: Download Copernicus DEM tiles
        run: |
          python scripts/download_dem_copernicus.py

      # 2. Decode each DEM tile → heightmap tile
      - name: Decode Copernicus DEM tiles to heightmaps
        run: |
          python scripts/decode_dem_copernicus_tiles.py

      # 3. Generate TIN geometry per tile
      - name: Generate TIN geometry
        run: |
          python scripts/build_tin.py

      # 4. Downsample heightmaps to low-res grids
      - name: Downsample to low-res grids
        run: |
          python scripts/downsample_grid.py --grid-size 32

      # 5. Compute terrain flags
      - name: Compute terrain flags
        run: |
          python scripts/compute_flags.py

      # 6. Generate terrain layers (replaces WorldPainter)
      - name: Generate terrain layers
        run: |
          python scripts/generate_terrain_layers.py

      # Upload artifacts
      - name: Upload heightmaps
        uses: actions/upload-artifact@v4
        with:
          name: heightmaps
          path: output/heightmaps/

      - name: Upload TIN geometry
        uses: actions/upload-artifact@v4
        with:
          name: tin
          path: output/tin/

      - name: Upload low-res grids
        uses: actions/upload-artifact@v4
        with:
          name: grids
          path: output/grids_lowres/

      - name: Upload flags
        uses: actions/upload-artifact@v4
        with:
          name: flags
          path: output/flags/

      - name: Upload terrain layers
        uses: actions/upload-artifact@v4
        with:
          name: terrain-layers
          path: output/layers/

  terrain-finalize:
    runs-on: ubuntu-latest
    needs: terrain-preprocess

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python + libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install numpy pillow trimesh pyyaml

      # Download artifacts
      - name: Download heightmaps
        uses: actions/download-artifact@v4
        with:
          name: heightmaps
          path: output/heightmaps/

      - name: Download TIN geometry
        uses: actions/download-artifact@v4
        with:
          name: tin
          path: output/tin/

      - name: Download low-res grids
        uses: actions/download-artifact@v4
        with:
          name: grids
          path: output/grids_lowres/

      - name: Download flags
        uses: actions/download-artifact@v4
        with:
          name: flags
          path: output/flags/

      - name: Download terrain layers
        uses: actions/download-artifact@v4
        with:
          name: terrain-layers
          path: output/layers/

      # 7. Package final terrain chunks
      - name: Convert terrain data to game chunks
        run: |
          python scripts/package_chunks.py

      - name: Upload final terrain chunks
        uses: actions/upload-artifact@v4
        with:
          name: game-terrain
          path: output/game_terrain/
